name: Release desktop apps

on:
  release:
    types: [published]

jobs:
  check-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Check release tag and app versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const tauriVersion = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const metadata = JSON.parse(execFileSync('cargo', ['metadata', '--no-deps', '--format-version', '1'], { encoding: 'utf8' }));
          const desktopVersion = metadata.packages.find((pkg) => pkg.name === 'anylisten-desktop')?.version;

          if (process.env.RELEASE_TAG !== `v${packageVersion}` || tauriVersion !== packageVersion || desktopVersion !== packageVersion) {
            console.error(`Version mismatch: tag=${process.env.RELEASE_TAG}, package=${packageVersion}, Tauri=${tauriVersion}, Cargo=${desktopVersion}`);
            process.exit(1);
          }
          NODE

  build:
    needs: check-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - runner: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: msi
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci

      - name: Upload Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = "target/$env:BUILD_TARGET/release/anylisten-desktop.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Windows executable not found: $binary"
          }
          $archive = "AnyListen-Cache-Exporter_$($env:RELEASE_TAG)_windows-x64-portable.zip"
          Compress-Archive -LiteralPath $binary -DestinationPath $archive
          gh release upload $env:RELEASE_TAG $archive --repo $env:GITHUB_REPOSITORY --clobber
